version: 3
tasks:
  nix:repair:
    cmd: sudo nix-store --verify --check-contents --repair

  nix:update:
    dir: nix
    cmd: nix flake update

  nix:copy:
    dir: nix
    cmd: sudo cp -R * /etc/nix-darwin

  nix:homebrew:update:
    dir: nix/modules/homebrew
    cmd: nix flake update

  nix:rebuild:
    dir: nix
    cmds:
      - task: nix:homebrew:update
      - sudo ulimit -n 65536
      - sudo darwin-rebuild switch --impure

  nix:cleanup:
    cmd: nix store gc

  home:*:
    vars:
      TARGET: "{{index .MATCH 0}}"
    cmds:
      - stow -t ~ {{.TARGET}}

  config:*:
    vars:
      TARGET: "{{index .MATCH 0}}"
    cmds:
      - mkdir -p ~/.config/{{.TARGET}}
      - stow -t ~/.config/{{.TARGET}} {{.TARGET}}

  mise:
    cmds:
      - mise install

  mise:cleanup:
    cmds:
      - rm ~/.local/state/mise/tracked-configs/*
      - mise prune -y

  disk:uuid:
    vars:
      DISK: "{{index .CLI_ARGS_LIST 0}}"
    cmd: |
      UUID=$(diskutil info /dev/{{.DISK}} | grep UUID | head -n 1 | awk -F ':' '{print $2}' | tr -s ' ')
      echo $UUID
      echo $UUID | pbcopy
